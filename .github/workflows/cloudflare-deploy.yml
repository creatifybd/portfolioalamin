name: Deploy live portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_PROVIDER != 'firebase'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment access and existing project
        id: cloudflare
        run: node scripts/check-cloudflare.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Publish existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=portfolio-alamin --branch=${{ steps.cloudflare.outputs.branch }}
      - name: Verify the live commit and application assets
        run: node scripts/verify-deployment.mjs https://portfolio-alamin.pages.dev
