    <script

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // Enhanced configuration for SEO and performance tracking
      gtag("config", "G-7CG50BBNZ0", {
        page_path: window.location.pathname,
        send_page_view: true,
        cookie_flags: "SameSite=Lax;Secure",
        anonymize_ip: true,
        allow_google_signals: true,
        allow_ad_personalization_signals: false,
      });

      // Custom dimensions for SEO tracking
      gtag("config", "G-7CG50BBNZ0", {
        custom_map: {
          custom_dimension_1: "page_category",
          custom_dimension_2: "content_type",
          custom_dimension_3: "user_intent",
        },
      });

      window.gtag = gtag;

      // Track SEO-specific events
      function trackSEOEvent(eventName, parameters) {
        gtag("event", eventName, {
          event_category: "SEO",
          ...parameters,
        });
      }

      // Track scroll depth for engagement
      let maxScroll = 0;
      window.addEventListener("scroll", function () {
        const scrollPercent = Math.round(
          (window.scrollY /
            (document.documentElement.scrollHeight - window.innerHeight)) *
            100,
        );
        if (scrollPercent > maxScroll) {
          maxScroll = scrollPercent;
          if (
            maxScroll === 25 ||
            maxScroll === 50 ||
            maxScroll === 75 ||
            maxScroll === 90
          ) {
            gtag("event", "scroll_depth", {
              event_category: "Engagement",
              value: maxScroll,
            });
          }
        }
      });

      // Track outbound clicks
      document.addEventListener("click", function (e) {
        const link = e.target.closest("a");
        if (link && link.hostname !== window.location.hostname) {
          gtag("event", "outbound_click", {
            event_category: "Outbound",
            event_label: link.href,
          });
        }
      });

      // Track portfolio item clicks
      document.addEventListener("click", function (e) {
        const portfolioItem = e.target.closest("[data-portfolio-item]");
        if (portfolioItem) {
          gtag("event", "portfolio_click", {
            event_category: "Portfolio",
            event_label: portfolioItem.dataset.portfolioItem || "Unknown",
          });
        }
      });

      // Track contact form interactions
      document.addEventListener(
        "focus",
        function (e) {
          if (e.target.matches('input[type="email"], textarea')) {
            gtag("event", "form_start", {
              event_category: "Contact",
              event_label: e.target.tagName,
            });
          }
        },
        true,
      );

      window.trackSEOEvent = trackSEOEvent;
    </script>

    <!-- Theme Restoration (Prevent Flash) -->
    <script>
      (function () {
        try {
          const saved = JSON.parse(localStorage.getItem("alamin_theme"));
          if (!saved) return;
          const { preset, isDark } = saved;
          const r = document.documentElement;
          if (preset.bg) r.style.setProperty("--bg", preset.bg);
          if (preset.bg2) r.style.setProperty("--bg2", preset.bg2);
          if (preset.bg3) r.style.setProperty("--bg3", preset.bg3);
          if (preset.accent) r.style.setProperty("--green", preset.accent);
          if (preset.accent2) r.style.setProperty("--green2", preset.accent2);
          if (preset.white) r.style.setProperty("--white", preset.white);
          if (preset.gray) r.style.setProperty("--gray", preset.gray);
          if (preset.border) r.style.setProperty("--border", preset.border);
          if (!isDark) {
            r.setAttribute("data-theme", "light");
            document.body && (document.body.style.background = preset.bg);
          } else {
            r.removeAttribute("data-theme");
          }
        } catch (e) {}
      })();
    </script>
